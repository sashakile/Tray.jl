[pretender]
mode = "tiered"
languages = ["auto"]
exclude = ["vendor/**", "node_modules/**", "**/*_generated.*", ".git/", "target/", "docs/build/"]

[roles.test]
paths = ["test/**", "**/*_test.*", "spec/**"]

[roles.library]
paths = ["src/**", "lib/**"]

[roles.script]
paths = ["scripts/**", "examples/**"]

[roles.generated]
paths = ["**/*.pb.go", "**/*_generated.*"]

[roles.vendor]
paths = ["vendor/**", "node_modules/**"]

[thresholds.test]
cyclomatic_max = 3
cognitive_max = 5
function_lines_max = 80
nesting_max = 2
params_max = 3
duplication_pct_max = 30
min_assertions = 0
