[pretender]
mode = "gate"
languages = ["auto"]
# Exclude .git/ to avoid fsmonitor--daemon.ipc socket errors
# Using src/ test/ paths in just pretender-check instead of root .
exclude = ["vendor/**", "node_modules/**", "**/*_generated.*", ".git/", "target/", "docs/build/"]

[roles.test]
paths = ["test/**", "**/*_test.*", "spec/**"]

[roles.library]
paths = ["src/**", "lib/**"]

[roles.script]
paths = ["scripts/**", "examples/**"]

[roles.generated]
paths = ["**/*.pb.go", "**/*_generated.*"]

[roles.vendor]
paths = ["vendor/**", "node_modules/**"]

[thresholds]
cyclomatic_max = 8
cognitive_max = 10
function_lines_max = 50
# High threshold accommodates test/runtests.jl (ReTestItems single-file convention, ~8800 loc)
file_lines_max = 10000
nesting_max = 1
params_max = 5
abc_max = 18
mi_min = 25
duplication_pct_max = 4

[thresholds.test]
cyclomatic_max = 3
cognitive_max = 3
function_lines_max = 50
nesting_max = 1
params_max = 3
abc_max = 18
duplication_pct_max = 20
min_assertions = 0

[thresholds.library]
exported_params_max = 5
exported_cyclomatic_max = 8
exported_lines_max = 50
require_docstring = true
