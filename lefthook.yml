# lefthook.yml — pre-commit hooks for Tray.jl
min_version: 1.11.0

pre-commit:
  parallel: true
  commands:
# ah:managed:start
    ah-check:
      run: ah check
# ah:managed:end
    goal-blocks:
      # Reject edits to MANAGED blocks unless SKIP_GOAL_CHECK=1
      # Checks all staged files for any added/modified lines containing MANAGED markers.
      run: >-
        bash -c '
        if [ -z "${SKIP_GOAL_CHECK:-}" ]; then
          for f in $(git diff --cached --name-only 2>/dev/null); do
            if [ -f "$f" ]; then
              # Only check added/modified lines (starting with +), not context lines
              ADDED=$(git diff --cached -- "$f" 2>/dev/null | grep -E "^\+.*MANAGED" | grep -v "^\+\+\+" || true)
              if [ -n "$ADDED" ]; then
                echo "ERROR: $f: MANAGED blocks may not be modified without SKIP_GOAL_CHECK=1"
                echo "       To override: SKIP_GOAL_CHECK=1 git commit ..."
                echo "       Modified MANAGED lines:"
                echo "$ADDED"
                exit 1
              fi
            fi
          done
        fi
        '
    julia-format:
      glob: "*.jl"
      run: >-
        bash -c 'for f in {staged_files}; do
        julia --project=. -e "using JuliaFormatter; exit(format(ARGS[1]; verbose=true, check=true) ? 0 : 1)" "$f" || exit;
        done'

    typos:
      glob: "*.{jl,md,toml,yml,yaml,txt}"
      run: typos {staged_files}

    eof-fixer:
      glob: "*"
      run: bash -c 'for f in {staged_files}; do [ -f "$f" ] && tail -c1 "$f" | read -r _ || echo >> "$f"; done'

pre-push:
  parallel: true
  commands:
    ci-test:
      run: julia --project=. -e 'using Pkg; Pkg.test()'

    ci-format:
      # Match CI: check every source file, not just push_files
      # Catches formatting drift in unstaged/untracked files before push
      run: >-
        julia --project=. -e
        'using JuliaFormatter;
        all(format(p; verbose=true, check=true) for p in ("src", "test", "docs/make.jl")) || exit(1)'

    ci-spell:
      glob: "*.{jl,md,toml,yml,yaml,txt}"
      run: typos .

    testaruda-shadow:
      # shadow mode: compute selection but report all tests should run
      run: testaruda select --shadow; [ $? -eq 10 ] && exit 0 || exit $?

    doc-check:
      run: >-
        bash -c '
        julia --project=docs -e "using Pkg; Pkg.develop(Pkg.PackageSpec(path=pwd())); Pkg.instantiate()"
        julia --project=docs docs/make.jl
        '

    dont-check:
      run: just dont-check
